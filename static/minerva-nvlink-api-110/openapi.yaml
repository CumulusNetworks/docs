      - in: query
        name: hostname
        schema:
          description: Filter by hostname
          items:
            type: string
          type: array
      - description: Filter by chassis serial number
        in: query
        name: chassisSerialNumber
        schema:
          $ref: "#/components/schemas/nvl-inventory.ChassisSerialNumber"
      - description: Filter by slot ID (valid only if chassisSerialNumber is provided)
        in: query
        name: slotID
        schema:
          $ref: "#/components/schemas/nvl-inventory.SlotID"
      - description: Filter by tray index (valid only if chassisSerialNumber is provided)
        in: query
        name: trayIndex
        schema:
          $ref: "#/components/schemas/nvl-inventory.TrayIndex"
      - description: Filter by host ID (valid only if trayIndex or slotID are provided)
        in: query
        name: hostID
        schema:
          $ref: "#/components/schemas/nvl-inventory.HostID"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/nvl-inventory.ComputeNode"
                type: array
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.Error"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.Error"
          description: Internal Error
      summary: Get list of Compute Nodes
      tags:
      - Compute Nodes
  /nmx/v1/compute-nodes/count:
    get:
