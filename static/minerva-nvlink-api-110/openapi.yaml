        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.ComputeNode"
          description: Success
        "400":
          $ref: "#/components/responses/nvl-inventory.Error400"
        "404":
          $ref: "#/components/responses/nvl-inventory.Error404"
        "500":
          $ref: "#/components/responses/nvl-inventory.Error500"
