      tags:
      - Ports
  /nmx/v1/ports/{id}:
    get:
      operationId: GetPort
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/EntityID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Port"
          description: Success
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      summary: Get a port
      tags:
      - Ports
    put:
      description: "Sets the admin state of a port, the only field of a port that can be updated. A switch node's admin state has its own path, `PUT /switch-nodes/{id}/admin-state`, because `PUT /switch-nodes/{id}` updates its name and description. The change runs asynchronously: follow the returned operation."
      operationId: UpdatePortAdminState
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/EntityID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminStateRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncResponse"
          description: "\"Update Port Admin State\" request accepted and was assigned an async Operation ID"
          headers:
            Location:
              $ref: "#/components/headers/OperationLocation"
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"
        "503":
          $ref: "#/components/responses/Error503"
      summary: Update a port's admin state
      tags:
      - NetworkEntity
