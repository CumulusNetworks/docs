  /minerva/v1/upgrade-switch:
    post:
      description: |
        Creates an asynchronous operation for upgrading switches with new NVOS/Firmware version.
        Supports two mutually exclusive request formats:
                1. Standard format with explicit switches list
                2. Domain-based format with domain UUIDs mapping to image IDs
      operationId: CreateSwitchUpgrade
      requestBody:
        content:
          application/json:
            examples:
              cpldDomainUpgrade:
                summary: Domain-based CPLD firmware upgrade
                value:
                  Domains:
                  - DomainID: 551137c2f9e1fac808a5f572
                    ImageID: 551137c2f9e1fac808a5f572
                  ImageID: 551137c2f9e1fac808a5f572
                  UpgradeType: cpld
              cpldSwitchUpgrade:
                summary: Switch-based CPLD firmware upgrade
                value:
                  ImageID: 551137c2f9e1fac808a5f572
                  ProfileID: 551137c2f9e1fac808a5f572
                  Switches:
                  - Address: 10.0.0.1
                    ImageID: 551137c2f9e1fac808a5f572
                    ProfileID: 551137c2f9e1fac808a5f572
                  UpgradeType: cpld
              domainBased:
                summary: Domain-based NVOS upgrade
                value:
                  Domains:
                  - DomainID: 551137c2f9e1fac808a5f572
                    ImageID: 551137c2f9e1fac808a5f572
                  ImageID: 551137c2f9e1fac808a5f572
                  UpgradeType: nvos
              switchBased:
                summary: Switch-based NVOS upgrade
                value:
                  ImageID: 551137c2f9e1fac808a5f572
                  ProfileID: 551137c2f9e1fac808a5f572
                  Switches:
                  - Address: 10.0.0.1
                    ImageID: 551137c2f9e1fac808a5f572
                    ProfileID: 551137c2f9e1fac808a5f572
                  UpgradeType: nvos
            schema:
              $ref: "#/components/schemas/provisioning-mgr.CreateSwitchUpgradeRequest"
        required: true
      responses:
        "202":
          $ref: "#/components/responses/provisioning-mgr.OperationResponse"
        "400":
          $ref: "#/components/responses/provisioning-mgr.Error400"
        "404":
          $ref: "#/components/responses/provisioning-mgr.Error404"
        "409":
          $ref: "#/components/responses/provisioning-mgr.Error409"
        "500":
          $ref: "#/components/responses/provisioning-mgr.Error500"
      summary: Upgrade switches with new NVOS/Firmware image
      tags:
      - SwitchUpgrade
