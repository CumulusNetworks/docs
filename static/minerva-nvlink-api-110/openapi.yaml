      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/nvl-service-mgr.EntityID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/nvl-service-mgr.UpdateAdminStateRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-service-mgr.AsyncResponse"
          description: "\"Update Port Admin State\" request accepted and was assigned an async Operation ID"
        "400":
          $ref: "#/components/responses/nvl-service-mgr.Error400"
        "404":
          $ref: "#/components/responses/nvl-service-mgr.Error404"
        "409":
