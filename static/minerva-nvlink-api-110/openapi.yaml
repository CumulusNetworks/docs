components:
  responses:
    Error400:
      content:
        application/json:
          example:
            customErrorCode: bad-request
            description: The request body or parameters are invalid.
            httpErrorCode: 400
          schema:
            $ref: "#/components/schemas/Error"
      description: The request was invalid or malformed.
    Error404:
      content:
        application/json:
          example:
            customErrorCode: not-found
            description: The requested resource was not found.
            httpErrorCode: 404
          schema:
            $ref: "#/components/schemas/Error"
      description: The requested resource was not found.
    Error500:
      content:
        application/json:
          example:
            customErrorCode: internal-error
            description: An unexpected internal error occurred.
            httpErrorCode: 500
          schema:
            $ref: "#/components/schemas/Error"
      description: An unexpected internal server error occurred.
    Error409:
      content:
        application/json:
          example:
            customErrorCode: conflict
            description: The request conflicts with the current state of the resource.
            httpErrorCode: 409
          schema:
            $ref: "#/components/schemas/Error"
      description: The request conflicts with the current state of the resource.
    Error503:
      content:
        application/json:
          example:
            customErrorCode: service-unavailable
            description: The service is currently unavailable.
            httpErrorCode: 503
          schema:
            $ref: "#/components/schemas/Error"
      description: The service is currently unavailable.
    Error405:
      content:
        application/json:
          example:
            customErrorCode: method-not-allowed
            description: The HTTP method is not allowed for this resource.
            httpErrorCode: 405
          schema:
            $ref: "#/components/schemas/Error"
      description: The HTTP method is not allowed for this resource.
  schemas:
    AdminState:
      enum:
      - UNKNOWN
      - UP
      - DOWN
      - DIAG
      type: string
      x-enum-varnames:
      - AdminStateUnknown
      - AdminStateUp
      - AdminStateDown
      - AdminStateDiag
    Chassis:
      additionalProperties: false
      properties:
        ComputeNodeIDList:
          items:
            $ref: "#/components/schemas/EntityID"
          type: array
        CreatedAt:
          $ref: "#/components/schemas/Timestamp"
        Description:
          summary: Brief description
          type: string
        DomainUUID:
          $ref: "#/components/schemas/UUID"
        ID:
          $ref: "#/components/schemas/EntityID"
        InternalID:
          $ref: "#/components/schemas/ChassisID"
        Name:
          summary: Helpful name
          type: string
        SerialNumber:
          $ref: "#/components/schemas/ChassisSerialNumber"
        SwitchNodeIDList:
          items:
            $ref: "#/components/schemas/EntityID"
          type: array
        UpdatedAt:
          $ref: "#/components/schemas/Timestamp"
      type: object
    ChassisID:
      description: The unique identifier of the chassis
      type: integer
    ChassisSerialNumber:
      description: The unique serial number of the chassis
      type: string
    ComputeNode:
      additionalProperties: false
      properties:
        CreatedAt:
          $ref: "#/components/schemas/Timestamp"
        Description:
          description: Brief description
          type: string
        DomainUUID:
          $ref: "#/components/schemas/UUID"
        GpuIDList:
          items:
            $ref: "#/components/schemas/EntityID"
          type: array
        Health:
          enum:
          - UNKNOWN
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          type: string
          x-enum-varnames:
          - ComputeNodeHealthUnknown
          - ComputeNodeHealthHealthy
          - ComputeNodeHealthDegraded
          - ComputeNodeHealthUnhealthy
        Hostname:
          description: Hostname of the compute tray
          type: string
        ID:
          $ref: "#/components/schemas/EntityID"
        LocationInfo:
          $ref: "#/components/schemas/LocationInfo"
        Name:
          description: Helpful name
          type: string
        Sensors:
          $ref: "#/components/schemas/NodeSensorsMap"
        UpdatedAt:
          $ref: "#/components/schemas/Timestamp"
      type: object
    ControlPlaneState:
      enum:
      - UNDEFINED
      - OFFLINE
      - STANDBY
      - CONFIGURED
      - TIMEOUT
      - ERROR
      - UNCONFIGURED
      - DEGRADED
      type: string
      x-enum-varnames:
      - ControlPlaneStateUndefined
      - ControlPlaneStateOffline
      - ControlPlaneStateStandby
      - ControlPlaneStateConfigured
      - ControlPlaneStateTimeout
      - ControlPlaneStateError
      - ControlPlaneStateUnconfigured
      - ControlPlaneStateDegraded
    Domain:
      additionalProperties: false
      properties:
        ControlPlaneState:
          $ref: "#/components/schemas/ControlPlaneState"
        CreatedAt:
          $ref: "#/components/schemas/Timestamp"
        DomainType:
          enum:
          - NVLink5
          summary: The Domain type. e.g. NVLink5
          type: string
        DomainUUID:
          $ref: "#/components/schemas/UUID"
        Health:
          enum:
          - UNKNOWN
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          - UNHEALTHY_DB_CORRUPTED
          type: string
          x-enum-varnames:
          - DomainHealthUnknown
          - DomainHealthHealthy
          - DomainHealthDegraded
          - DomainHealthUnhealthy
          - DomainHealthUnhealthyDbCorrupted
        ID:
          $ref: "#/components/schemas/EntityID"
        ProfileID:
          $ref: "#/components/schemas/EntityID"
        UpdatedAt:
          $ref: "#/components/schemas/Timestamp"
      required:
      - ControlPlaneState
      type: object
    EntityID:
      description: System unique identifier.
      example: 551137c2f9e1fac808a5f572
      pattern: ^[0-9a-fA-F]{24}$
      type: string
    Error:
      additionalProperties: false
      description: NMX-M Error Information
      properties:
        customErrorCode:
          description: A more granular, textual custom error code
          example: internal-error
          type: string
        description:
          description: A detailed error description
          example: "Something really bad happened with resource [id: 123] and we are so sorry about it."
          type: string
        httpErrorCode:
          description: HTTP error code
          example: 500
          type: integer
      required:
      - httpErrorCode
      - customErrorCode
      - description
      type: object
      x-go-type: liberr.Error
      x-go-type-import:
        name: liberr
        path: nvl/errors
    FWVersions:
      properties:
        ASIC:
          description: ASIC firmware version
          type: string
        BIOS:
          description: BIOS firmware version
          type: string
        BMC:
          description: BMC firmware version
          type: string
        CPLD1:
          description: CPLD1 firmware version
          type: string
        CPLD2:
          description: CPLD2 firmware version
          type: string
        CPLD3:
          description: CPLD3 firmware version
          type: string
        CPLD4:
          description: CPLD4 firmware version
          type: string
        EROT:
          description: EROT firmware version
          type: string
        EROTASIC1:
          description: EROT ASIC1 firmware version
          type: string
        EROTASIC2:
          description: EROT ASIC2 firmware version
          type: string
        EROTBMC:
