                $ref: "#/components/schemas/ComputeNode"
          description: Success
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      summary: Get a compute node
      tags:
      - Compute Nodes
    put:
      operationId: UpdateComputeNode
      parameters:
      - in: path
        name: id
        required: true
