      operationId: GetPortList
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/UUID"
          type: array
      - description: Filter by port unique identifier
        in: query
        name: portUID
        schema:
          $ref: "#/components/schemas/uint64"
      - description: Filter by port type
        in: query
        name: portType
        schema:
          $ref: "#/components/schemas/PortType"
      - description: Filter by chassis serial number
        in: query
        name: chassisSerialNumber
        schema:
