
openapi: 3.0.3
info:
  title: NVIDIA Minerva NVL REST API
  version: "1.1.0"
  description: One document over the NVL services' APIs.
servers:
- url: /
tags:
- description: NVLink domains. Every other entity is scoped to a domain, and most queries take a `domain` parameter that filters by these UUIDs.
  name: Domains
- description: Physical enclosures, addressed by serial number.
  name: Chassis
- description: Switch boards within a chassis.
  name: Switch Nodes
- description: Switch ASICs on a switch node.
  name: Switches
- description: Compute boards within a chassis.
  name: Compute Nodes
- description: GPU devices on a compute node.
  name: GPUs
- description: NVLink port endpoints on switches and GPUs.
  name: Ports
- description: "NVLink partitions: the groups of GPUs that can reach each other over NVLink. Changes are asynchronous and return an operation ID."
  name: Partitions
- description: Asynchronous requests, such as partition changes, and their progress.
  name: Operations
- description: NMX services (Telemetry and Controller) registered with NVIDIA Minerva, and their connection status.
  name: Services
- description: Administrative state of ports and switch nodes.
  name: NetworkEntity
- description: System configuration settings
  name: Settings
- description: Named switch login credentials, used to connect to switches.
  name: SwitchProfiles
paths:
  /nmx/v1/chassis:
    get:
      operationId: GetChassisList
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/UUID"
          type: array
      - description: Filter by chassis serial number
        in: query
        name: chassisSerialNumber
        schema:
          $ref: "#/components/schemas/ChassisSerialNumber"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Chassis"
                type: array
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Error
      summary: Get a list of chassis
      tags:
      - Chassis
  /nmx/v1/chassis/count:
    get:
      operationId: GetChassisCount
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/UUID"
          type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkEntityCountResponse"
          description: Success
        "500":
          $ref: "#/components/responses/Error500"
      summary: Get the number of chassis
      tags:
      - Chassis
  /nmx/v1/chassis/{id}:
    get:
      operationId: GetChassis
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/EntityID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chassis"
          description: Success
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      summary: Get a chassis
      tags:
      - Chassis
    put:
      operationId: UpdateChassis
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/EntityID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkEntityUpdatePayload"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chassis"
          description: Success
        "400":
          $ref: "#/components/responses/Error400"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      summary: Update a chassis
      tags:
      - Chassis
  /nmx/v1/compute-nodes:
    get:
      operationId: GetComputeNodesList
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/UUID"
          type: array
      - in: query
        name: hostname
        schema:
          description: Filter by hostname
          items:
            type: string
          type: array
      - description: Filter by chassis serial number
        in: query
        name: chassisSerialNumber
        schema:
          $ref: "#/components/schemas/ChassisSerialNumber"
      - description: Filter by slot ID (valid only if chassisSerialNumber is provided)
        in: query
        name: slotID
        schema:
          $ref: "#/components/schemas/SlotID"
      - description: Filter by tray index (valid only if chassisSerialNumber is provided)
        in: query
        name: trayIndex
        schema:
          $ref: "#/components/schemas/TrayIndex"
      - description: Filter by host ID (valid only if trayIndex or slotID are provided)
        in: query
        name: hostID
        schema:
          $ref: "#/components/schemas/HostID"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComputeNode"
                type: array
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Error
      summary: Get a list of compute nodes
      tags:
      - Compute Nodes
  /nmx/v1/compute-nodes/count:
    get:
      operationId: GetComputeNodesCount
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/UUID"
          type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkEntityCountResponse"
          description: Success
        "500":
          $ref: "#/components/responses/Error500"
      summary: Get the number of compute nodes
      tags:
      - Compute Nodes
  /nmx/v1/compute-nodes/{id}:
    get:
