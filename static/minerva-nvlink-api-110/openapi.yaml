        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"
      summary: Update a domain profile
      tags:
      - Domains
  /nmx/v1/gpus:
    get:
      operationId: GetGPUList
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/UUID"
          type: array
      - description: Filter by GPU device unique identifier. Accepts a decimal number or a hex value (e.g. 0x1A2B3C).
        in: query
        name: deviceUID
        schema:
