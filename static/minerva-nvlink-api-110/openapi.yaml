
openapi: 3.0.3
info:
  title: NVIDIA Minerva NVL REST API
  version: ""
  description: One document over the NVL services' APIs.
servers:
- url: /
tags:
- description: NVLink domains. Every other entity is scoped to a domain, and most queries take a `domain` parameter that filters by these UUIDs.
  name: Domains
- description: Physical enclosures, addressed by serial number.
  name: Chassis
- description: Switch boards within a chassis.
  name: Switch Nodes
- description: Switch ASICs on a switch node.
  name: Switches
- description: Compute boards within a chassis.
  name: Compute Nodes
- description: GPU devices on a compute node.
  name: GPUs
- description: NVLink port endpoints on switches and GPUs.
  name: Ports
- name: Partitions
- name: Operations
- name: Services
- name: NetworkEntity
- description: System configuration settings
  name: Settings
- description: Bring-up describes the switch configuration process, including switch configuration and NMX-related services registration.
  name: BringUp
- description: Switch upgrade describes the process of upgrading switch NVOS versions.
  name: SwitchUpgrade
paths:
  /nmx/v1/chassis:
    get:
      operationId: GetChassisList
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/nvl-inventory.UUID"
          type: array
      - description: Filter by chassis serial number
        in: query
        name: chassisSerialNumber
        schema:
          $ref: "#/components/schemas/nvl-inventory.ChassisSerialNumber"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/nvl-inventory.Chassis"
                type: array
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.Error"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.Error"
          description: Internal Error
      summary: Get list of Chassis
      tags:
      - Chassis
  /nmx/v1/chassis/count:
    get:
      operationId: GetChassisCount
      parameters:
      - in: query
        name: domain
        schema:
          description: Domain UUID list
          items:
            $ref: "#/components/schemas/nvl-inventory.UUID"
          type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.NetworkEntityCountResponse"
          description: Success
        "500":
          $ref: "#/components/responses/nvl-inventory.Error500"
      summary: Get total count of chassis
      tags:
      - Chassis
  /nmx/v1/chassis/{id}:
    get:
      operationId: GetChassis
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/nvl-inventory.EntityID"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.Chassis"
          description: Success
        "400":
          $ref: "#/components/responses/nvl-inventory.Error400"
        "404":
          $ref: "#/components/responses/nvl-inventory.Error404"
        "500":
          $ref: "#/components/responses/nvl-inventory.Error500"
      summary: Chassis information
      tags:
      - Chassis
    put:
      operationId: UpdateChassis
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/nvl-inventory.EntityID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/nvl-inventory.NetworkEntityUpdatePayload"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/nvl-inventory.Chassis"
          description: Success
        "400":
          $ref: "#/components/responses/nvl-inventory.Error400"
        "404":
          $ref: "#/components/responses/nvl-inventory.Error404"
        "500":
          $ref: "#/components/responses/nvl-inventory.Error500"
